<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Bank · Qalqan</title>
  <link rel="stylesheet" href="/static/styles.css?v=7">
</head>
<body>
  <main class="app">
    <div class="header">
      <div class="logo">Demo Bank</div>
      <div class="modes" id="modes">
        <button type="button" data-mode="off" class="mode active">Щит выкл</button>
        <button type="button" data-mode="rule" class="mode">Только правило</button>
        <button type="button" data-mode="full" class="mode">Полный щит</button>
      </div>
    </div>

    <section class="card">
      <div class="muted" id="client">Карта</div>
      <div class="balance" id="balance">—</div>
      <div class="deposits" id="deposits"></div>
    </section>

    <section class="card">
      <div class="muted">ИИ-консультант по сбережениям</div>
      <div class="scenarios" id="scenarios"></div>
      <form id="advise-form">
        <textarea id="advise-request" placeholder="Или напишите своими словами: сколько денег и когда понадобятся"></textarea>
        <button id="advise-btn" type="submit">Составить план</button>
      </form>
      <button type="button" class="ghost" id="recording-btn">Показать запись прогона без щита</button>
      <div id="plan"></div>
    </section>

    <section class="card">
      <div class="muted">ИИ-ассистент</div>
      <div class="chat-log" id="chat"></div>
      <form class="row" id="chat-form">
        <input id="question" placeholder="Например: покажи мои последние операции" autocomplete="off">
        <button id="ask" type="submit">→</button>
      </form>
    </section>

    <section class="card">
      <div class="muted">Последние операции</div>
      <ul class="ops" id="ops"></ul>
    </section>

    <section class="card shield-log" id="incidents-card" hidden>
      <div class="muted">Журнал щита</div>
      <ul class="ops" id="incidents"></ul>
    </section>

    <button class="ghost" id="reset" type="button">Сбросить демо</button>
  </main>

  <div class="banner" id="banner" hidden>
    <div class="banner-box" id="banner-box">
      <div class="banner-title" id="banner-title"></div>
      <div class="banner-text" id="banner-text"></div>
      <button type="button" id="banner-close">Понятно</button>
    </div>
  </div>
  <script src="/static/app.js?v=7"></script>
</body>
</html>
